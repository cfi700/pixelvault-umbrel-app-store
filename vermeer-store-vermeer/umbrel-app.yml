manifestVersion: 1
id: vermeer-store-vermeer
category: files
name: Vermeer
version: "2.7.1"
tagline: Encrypted photo, video and document albums – private by design
description: >-
  Vermeer keeps your photos, videos and PDF documents AES-256 encrypted on
  your own Umbrel.
  Every file is encrypted server-side – neither originals, nor thumbnails,
  nor video poster frames are stored in plain text on disk. Your password
  derives your personal key; the keys themselves never touch the disk
  unencrypted.


  Features:


  - AES-256-GCM encryption for photos, videos, PDFs, thumbnails and poster frames

  - PDF documents in albums, shown page by page in the app – no download button

  - Animated GIFs with their own display size limit

  - Real video streaming from encrypted storage (MP4 / WebM / MOV, chunked format)

  - Chunked upload for large files – works behind 100 MB body limits (e.g. Cloudflare Tunnel)

  - Albums and sub-albums with unlimited depth, plus linking one photo into several albums

  - Hidden albums protected by a 4-digit PIN, optionally invisible to observers

  - Three roles: admin, main users, and read-only observers with per-album access

  - Personal recovery code for main users

  - Statistics per user (views, viewers, observer logins), protected by password re-auth

  - Configurable gallery: name, login taglines, colours, thumbnail and lightbox sizes

  - Favourites, slideshow and manual photo ordering per album

  - Duplicate detection on upload; 10-minute undo window after deleting

  - Owner-only ZIP export as backup; no single-file downloads

  - Installable as an app on phones and desktops (no service worker)

  - DE / EN language toggle


  First login: admin / admin – change the password immediately.
releaseNotes: >-
  2.7.1 – Three small corrections.

  The login screen now places the cursor in the username field straight away,
  so you can start typing without clicking first.

  In the statistics, the columns of "Most viewed photos" and "Most viewed
  albums" have been reordered so that the important numbers come first: photo,
  views, viewers, album, owner – and album, views, photos, owner. The figures
  themselves are unchanged.

  Updating from 2.x keeps all data, albums and users.
