manifestVersion: 1
id: vermeer-store-vermeer
category: files
name: Vermeer
version: "1.10.3"
tagline: Encrypted photo albums – private by design
description: >-
  Vermeer stores your photos AES-256 encrypted on your Umbrel.
  All images are encrypted server-side – neither originals nor
  thumbnails are stored in plain text on disk.

  Features:

  - AES-256-CBC encryption for all photos and thumbnails

  - Album and sub-album structure with unlimited depth

  - User management with per-album access control

  - Download protection: only the owner can download originals

  - DE / EN language toggle

  Default login: admin / admin (change immediately!)

releaseNotes: >-
  1.10.3 – Bugfix video playback controls: tapping a video in the
  lightbox closed it instead of showing the native controls, making
  seeking impossible. The transparent save-protection overlay covered
  the video and swallowed all clicks/touches; it is now hidden in
  video mode (right-click stays blocked via the global handler,
  controlsList="nodownload" stays active) and re-enabled for photos.
  Swipe navigation no longer fires when touching the video (timeline
  scrubbing works), and arrow keys are left to the video for seeking
  while a video is shown.
  Includes 1.10.2 (observer link badge removed) and 1.10.1 (Android
  back button forward-trap).

developer: Vermeer
website: https://github.com/cfi700/vermeer-umbrel-app-store
dependencies: []
repo: https://github.com/cfi700/vermeer-umbrel-app-store
support: https://github.com/cfi700/vermeer-umbrel-app-store/issues
port: 3769
gallery: []
path: ""
defaultUsername: admin
defaultPassword: admin
