manifestVersion: 1
id: vermeer-store-vermeer
category: files
name: Vermeer
version: "2.5.0"
tagline: Encrypted photo and video albums – private by design
description: >-
  Vermeer keeps your photos and videos AES-256 encrypted on your own Umbrel.
  Every file is encrypted server-side – neither originals, nor thumbnails,
  nor video poster frames are stored in plain text on disk. Your password
  derives your personal key; the keys themselves never touch the disk
  unencrypted.


  Features:


  - AES-256-GCM encryption for photos, videos, thumbnails and poster frames

  - Real video streaming from encrypted storage (MP4 / WebM / MOV, chunked format)

  - Chunked upload for large files – works behind 100 MB body limits (e.g. Cloudflare Tunnel)

  - Albums and sub-albums with unlimited depth, plus linking one photo into several albums

  - Hidden albums protected by a 4-digit PIN, optionally invisible to observers

  - Three roles: admin, main users, and read-only observers with per-album access

  - Personal recovery code for main users

  - Statistics per user (views, viewers, observer logins), protected by password re-auth

  - Configurable gallery: name, login taglines, colours, thumbnail and lightbox sizes

  - Favourites, slideshow and manual photo ordering per album

  - Duplicate detection on upload; 10-minute undo window after deleting

  - Owner-only ZIP export as backup; no single-file downloads

  - Installable as an app on phones and desktops (no service worker)

  - DE / EN language toggle


  First login: admin / admin – change the password immediately.
releaseNotes: >-
  2.5.0 – A round of small conveniences plus one invisible but important
  safety net.


  Photos can now be moved to any position inside an album: select one photo,
  press "Position", then tap the photo it should go behind. No dragging, so it
  works the same on a phone as on a desktop. A new sort menu offers "by capture
  date", which uses the capture time read from the file during import.


  Also new: mark photos as favourites and view them all in one place, a
  slideshow button in the large view, duplicate files are recognised during
  upload and skipped, and deleting now shows an "Undo" button for ten minutes
  before anything is actually removed. Admins see how full the disk is.


  Under the hood, the database is now written with a full sync and keeps five
  rolling backups; if the main file is ever damaged, the app falls back to the
  newest usable copy instead of starting empty. The interface is no longer
  cached, so updates take effect immediately without clearing website data.
  The gallery can be added to a phone's home screen.


  Updating from 2.x keeps all data, albums and users.
